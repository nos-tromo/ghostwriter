
# Access log without request data: no query string, client IP, referer or
# user agent. This file is included in the base config's http context, so
# the format is declared here and selected in the server block below.
log_format scrubbed '$time_iso8601 "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_x_request_id"';

# Proxy target URI: strip the /ghostwriter prefix from the RAW request URI so
# percent-encoding survives ($uri would arrive decoded and un-re-encoded;
# $request_uri would keep the prefix the backend doesn't know).
# $request_uri includes the query string, so no $is_args$args needed.
map $request_uri $proxy_uri {
    ~^/ghostwriter(?<rest>/.+)$ $rest;
    default $request_uri;
}

server {
    # 8080: the unprivileged nginx image runs as uid 101 and cannot bind
    # ports below 1024 (deploy ADR 0001).
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;
    root /usr/share/nginx/html;

    # Replaces the image's inherited `main` format, which logs the full
    # request line (query string included), client IP, referer and user agent.
    access_log /var/log/nginx/access.log scrubbed;

    # Never spill proxied responses to /tmp: it is a 16m tmpfs (compose), so
    # a large download would be cut off mid-body.
    proxy_max_temp_file_size 0;

    set $backend_upstream "backend:8000";

    # Canonical sub-path: strip the /ghostwriter prefix so the existing
    # root-anchored locations below apply unchanged. (/.+ not /.*: the
    # bare prefix must fall through to the SPA fallback, not rewrite to
    # "/" and loop through the redirect below.)
    rewrite ^/ghostwriter(/.+)$ $1;

    # Convenience for direct (dev) access; via the gateway requests
    # always arrive prefixed.
    location = / {
        return 302 /ghostwriter/;
    }

    # The chat stream (SSE): each token frame flushes to the client at once,
    # and an answer with tool calls may take minutes.
    location ~ ^/api/chats/[^/]+/(messages|regenerate)$ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://$backend_upstream$proxy_uri;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        client_max_body_size 1m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    # Attachments: up to 50 MB per file, streamed through to workbench rather
    # than spooled to the 16m /tmp tmpfs.
    location ~ ^/api/chats/[^/]+/attachments$ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://$backend_upstream$proxy_uri;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        client_max_body_size 51m;
        proxy_request_buffering off;
        proxy_read_timeout 10m;
    }

    # Dictation: a recording of at most 10 MB, held in memory by the backend.
    # The read timeout outlasts the backend's own bound on the router (60 s
    # per wait), so the SPA gets the backend's JSON 502, not nginx's 504.
    location = /api/transcribe {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://$backend_upstream$proxy_uri;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_read_timeout 3m;
    }

    # Downloads stream back from workbench.
    location ~ ^/api/chats/[^/]+/files/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://$backend_upstream$proxy_uri;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # All other API calls proxy same-origin to the FastAPI backend.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://$backend_upstream$proxy_uri;
        proxy_set_header Host $host;
        client_max_body_size 1m;
    }

    # Hashed, immutable build assets.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback for client-side routing.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri /index.html;
    }
}
